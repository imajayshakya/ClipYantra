name: ClipYantra CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  UV_VERSION: "latest"

jobs:
  # =========================================================================
  # Lint & Type Check
  # =========================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "uv"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies (backend)
        working-directory: ./backend
        run: |
          uv sync --frozen --all-extras

      - name: Install dependencies (workers)
        working-directory: ./workers
        run: |
          uv sync --frozen --all-extras

      - name: Run Ruff (backend)
        working-directory: ./backend
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Ruff (workers)
        working-directory: ./workers
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run MyPy (backend)
        working-directory: ./backend
        run: |
          uv run mypy app/

      - name: Run MyPy (workers)
        working-directory: ./workers
        run: |
          uv run mypy app/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run ESLint (frontend)
        working-directory: ./frontend
        run: |
          npm run lint

      - name: Run TypeScript check (frontend)
        working-directory: ./frontend
        run: |
          npm run type-check

  # =========================================================================
  # Unit Tests
  # =========================================================================
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        component: [backend, workers]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "uv"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        working-directory: ./${{ matrix.component }}
        run: |
          uv sync --frozen --all-extras

      - name: Start services
        run: |
          docker-compose -f infra/docker/docker-compose.yml up -d postgres redis
          sleep 10

      - name: Run unit tests
        working-directory: ./${{ matrix.component }}
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipyantra
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run pytest tests/unit -v --tb=short --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./${{ matrix.component }}/coverage.xml
          flags: ${{ matrix.component }}
          name: ${{ matrix.component }}-unit

      - name: Stop services
        if: always()
        run: |
          docker-compose -f infra/docker/docker-compose.yml down

  # =========================================================================
  # Integration Tests
  # =========================================================================
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "uv"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies (workers)
        working-directory: ./workers
        run: |
          uv sync --frozen --all-extras

      - name: Start full stack
        run: |
          docker-compose -f infra/docker/docker-compose.yml up -d
          sleep 30

      - name: Run integration tests
        working-directory: ./workers
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/clipyantra
          REDIS_URL: redis://localhost:6379/0
          BACKEND_API_URL: http://localhost:8000
        run: |
          uv run pytest tests/integration -v --tb=short

      - name: Stop services
        if: always()
        run: |
          docker-compose -f infra/docker/docker-compose.yml down

  # =========================================================================
  # Frontend Tests
  # =========================================================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run unit tests
        working-directory: ./frontend
        run: |
          npm run test:unit -- --coverage

      - name: Run e2e tests
        working-directory: ./frontend
        run: |
          npm run test:e2e

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm run build

  # =========================================================================
  # Docker Build & Push
  # =========================================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    strategy:
      matrix:
        service: [backend, frontend, workers]
        include:
          - service: backend
            context: ./backend
            dockerfile: Dockerfile
          - service: frontend
            context: ./frontend
            dockerfile: Dockerfile
          - service: workers
            context: ./workers
            dockerfile: Dockerfile
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

  # =========================================================================
  # Terraform Validation
  # =========================================================================
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"

      - name: Initialize Terraform
        working-directory: ./infra/terraform
        run: |
          terraform init -backend=false

      - name: Validate Terraform
        working-directory: ./infra/terraform
        run: |
          terraform validate

      - name: Format Check
        working-directory: ./infra/terraform
        run: |
          terraform fmt -check -recursive

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1
        with:
          working_directory: ./infra/terraform

  # =========================================================================
  # Kubernetes Manifests Validation
  # =========================================================================
  k8s:
    name: K8s Manifests Validate
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize_version: "5.4.3"

      - name: Validate base manifests
        working-directory: ./infra/k8s/base
        run: |
          kustomize build . | kubectl apply --dry-run=client -f -

      - name: Validate dev overlay
        working-directory: ./infra/k8s/overlays/dev
        run: |
          kustomize build . | kubectl apply --dry-run=client -f -

      - name: Validate staging overlay
        working-directory: ./infra/k8s/overlays/staging
        run: |
          kustomize build . | kubectl apply --dry-run=client -f -

      - name: Validate prod overlay
        working-directory: ./infra/k8s/overlays/prod
        run: |
          kustomize build . | kubectl apply --dry-run=client -f -

  # =========================================================================
  # Security Scan
  # =========================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Bandit (Python security)
        run: |
          pip install bandit
          bandit -r backend/ workers/ -f json -o bandit-results.json || true

      - name: Run npm audit (frontend)
        working-directory: ./frontend
        run: |
          npm audit --audit-level=high || true

  # =========================================================================
  # Release
  # =========================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [docker, terraform, k8s, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate changelog
        run: |
          npx conventional-changelog-cli -p angular -i CHANGELOG.md -s -r 0

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
