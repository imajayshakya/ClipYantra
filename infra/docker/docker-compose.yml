version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: clipyantra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipyantra}
      POSTGRES_USER: ${POSTGRES_USER:-clipyantra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipyantra}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipyantra} -d ${POSTGRES_DB:-clipyantra}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clipyantra-network
    restart: unless-stopped

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: clipyantra-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clipyantra-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: clipyantra-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clipyantra}:${POSTGRES_PASSWORD:-clipyantra}@postgres:5432/${POSTGRES_DB:-clipyantra}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - ../../backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clipyantra-network
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: clipyantra-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
      - NODE_ENV=development
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - clipyantra-network
    restart: unless-stopped

  # Worker (Celery)
  worker:
    build:
      context: ../../workers
      dockerfile: Dockerfile
    container_name: clipyantra-worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clipyantra}:${POSTGRES_PASSWORD:-clipyantra}@postgres:5432/${POSTGRES_DB:-clipyantra}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ENVIRONMENT=development
      - DEBUG=true
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - WHISPER_MODEL=base
    volumes:
      - ../../workers:/app
      - /app/.venv
      - media_storage:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clipyantra-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: clipyantra-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_storage:/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - clipyantra-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  media_storage:
    driver: local

networks:
  clipyantra-network:
    driver: bridge
    name: clipyantra-network
