version: '3.8'

services:
  # Backend with hot reload and debug port
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile.dev
    container_name: clipyantra-backend-dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clipyantra}:${POSTGRES_PASSWORD:-clipyantra}@postgres:5432/${POSTGRES_DB:-clipyantra}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ENVIRONMENT=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - ../../backend:/app
      - /app/.venv
    ports:
      - "8000:8000"
      - "5678:5678"  # Debug port for VS Code / PyCharm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clipyantra-network

  # Frontend with hot reload
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    container_name: clipyantra-frontend-dev
    command: npm run dev
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ../../frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - clipyantra-network

  # Worker with hot reload
  worker:
    build:
      context: ../../workers
      dockerfile: Dockerfile.dev
    container_name: clipyantra-worker-dev
    command: celery -A app.celery_app worker --loglevel=INFO --pool=solo --concurrency=1
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clipyantra}:${POSTGRES_PASSWORD:-clipyantra}@postgres:5432/${POSTGRES_DB:-clipyantra}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - ENVIRONMENT=development
      - DEBUG=true
      - FFMPEG_PATH=/usr/bin/ffmpeg
      - WHISPER_MODEL=base
    volumes:
      - ../../workers:/app
      - /app/.venv
      - media_storage:/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clipyantra-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # PostgreSQL with init scripts for dev
  postgres:
    image: postgres:15-alpine
    container_name: clipyantra-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clipyantra_dev}
      POSTGRES_USER: ${POSTGRES_USER:-clipyantra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipyantra}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clipyantra} -d ${POSTGRES_DB:-clipyantra_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clipyantra-network

  # Redis for dev
  redis:
    image: redis:7-alpine
    container_name: clipyantra-redis-dev
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_dev_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clipyantra-network

  # Nginx for dev (with dev-specific config)
  nginx:
    image: nginx:alpine
    container_name: clipyantra-nginx-dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - media_storage:/media:ro
    depends_on:
      - backend
      - frontend
    networks:
      - clipyantra-network

volumes:
  postgres_dev_data:
    driver: local
  redis_dev_data:
    driver: local
  media_storage:
    driver: local

networks:
  clipyantra-network:
    driver: bridge
    name: clipyantra-network-dev