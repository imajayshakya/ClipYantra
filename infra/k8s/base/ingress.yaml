apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clipyantra-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - clipyantra.com
        - www.clipyantra.com
      secretName: clipyantra-tls
  rules:
    - host: clipyantra.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: clipyantra-backend
                port:
                  number: 8000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: clipyantra-backend
                port:
                  number: 8000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: clipyantra-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clipyantra-frontend
                port:
                  number: 3000
    - host: www.clipyantra.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clipyantra-frontend
                port:
                  number: 3000
---
