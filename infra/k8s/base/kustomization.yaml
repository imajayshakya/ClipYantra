apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: clipyantra

resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  app: clipyantra
  managed-by: kustomize

images:
  - name: clipyantra/backend
    newTag: v1.0.0
  - name: clipyantra/frontend
    newTag: v1.0.0
  - name: clipyantra/worker
    newTag: v1.0.0

configMapGenerator:
  - name: clipyantra-config
    behavior: merge
    literals:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - FRONTEND_URL=https://clipyantra.com
      - CORS_ORIGINS=https://clipyantra.com,https://www.clipyantra.com

secretGenerator:
  - name: clipyantra-secrets
    behavior: merge
    envs:
      - secrets.env

patchesStrategicMerge: []

# Replicas will be overridden in overlays
replicas:
  - name: clipyantra-backend
    count: 2
  - name: clipyantra-frontend
    count: 2
  - name: clipyantra-worker
    count: 2