apiVersion: v1
kind: Service
metadata:
  name: clipyantra-backend
  labels:
    app: clipyantra
    component: backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: clipyantra
    component: backend
---
apiVersion: v1
kind: Service
metadata:
  name: clipyantra-frontend
  labels:
    app: clipyantra
    component: frontend
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: clipyantra
    component: frontend
---
apiVersion: v1
kind: Service
metadata:
  name: clipyantra-worker
  labels:
    app: clipyantra
    component: worker
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: clipyantra
    component: worker
---
apiVersion: v1
kind: Service
metadata:
  name: clipyantra-postgres
  labels:
    app: clipyantra
    component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app: clipyantra
    component: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: clipyantra-redis
  labels:
    app: clipyantra
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: clipyantra
    component: redis