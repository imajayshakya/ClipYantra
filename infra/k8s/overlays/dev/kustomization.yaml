apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: clipyantra-dev

resources:
  - ../../base

namePrefix: dev-

images:
  - name: clipyantra/backend
    newTag: dev-latest
  - name: clipyantra/frontend
    newTag: dev-latest
  - name: clipyantra/worker
    newTag: dev-latest

configMapGenerator:
  - name: clipyantra-config
    behavior: merge
    literals:
      - ENVIRONMENT=development
      - LOG_LEVEL=debug
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - FRONTEND_URL=https://dev.clipyantra.com
      - CORS_ORIGINS=https://dev.clipyantra.com,http://localhost:3000

replicas:
  - name: clipyantra-backend
    count: 1
  - name: clipyantra-frontend
    count: 1
  - name: clipyantra-worker
    count: 1

patchesStrategicMerge:
  - backend-dev-patch.yaml
  - frontend-dev-patch.yaml
  - worker-dev-patch.yaml