apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-clipyantra-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: staging-clipyantra-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: staging-clipyantra-secrets
                  key: REDIS_URL
            - name: DEBUG
              value: "false"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"