apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-clipyantra-frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://staging-api.clipyantra.com
            - name: NEXT_PUBLIC_WS_URL
              value: wss://staging-api.clipyantra.com/ws
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"