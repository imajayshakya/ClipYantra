apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-clipyantra-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: staging-clipyantra-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: staging-clipyantra-secrets
                  key: REDIS_URL
            - name: DEBUG
              value: "false"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5