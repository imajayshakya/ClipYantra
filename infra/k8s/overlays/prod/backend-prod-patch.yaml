apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipyantra-backend
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clipyantra-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: clipyantra-secrets
                  key: REDIS_URL
            - name: DEBUG
              value: "false"
            - name: SENTRY_DSN
              valueFrom:
                secretKeyRef:
                  name: clipyantra-secrets
                  key: SENTRY_DSN
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - clipyantra-backend
                topologyKey: kubernetes.io/hostname