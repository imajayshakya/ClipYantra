apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipyantra-worker
spec:
  template:
    spec:
      containers:
        - name: worker
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clipyantra-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: clipyantra-secrets
                  key: REDIS_URL
            - name: DEBUG
              value: "false"
            - name: CELERY_CONCURRENCY
              value: "4"
            - name: CELERY_PREFETCH_MULTIPLIER
              value: "1"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
            limits:
              memory: "4Gi"
              cpu: "4000m"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - clipyantra-worker
                topologyKey: kubernetes.io/hostname