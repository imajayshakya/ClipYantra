apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipyantra-frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.clipyantra.com
            - name: NEXT_PUBLIC_WS_URL
              value: wss://api.clipyantra.com/ws
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - clipyantra-frontend
                topologyKey: kubernetes.io/hostname