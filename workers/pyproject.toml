[project]
name = "clipyantra-workers"
version = "1.0.0"
description = "ClipYantra background workers for media processing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ClipYantra Team", email = "team@clipyantra.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    # Core
    "celery[redis]==5.4.*",
    "redis==5.0.*",
    "sqlalchemy[asyncio]==2.0.*",
        "psycopg[binary]==3.2.*",
    "pydantic==2.8.*",
    "pydantic-settings==2.3.*",
    "python-dotenv==1.0.*",
    
    # Media Processing
    "ffmpeg-python==0.2.*",
    "opencv-python-headless==4.10.*",
    
    # Transcription
    "faster-whisper==1.2.*",
        "pyannote.audio==3.3.*",
        "huggingface-hub==0.28.*",
    
    # Analysis
    "scikit-learn==1.9.*",
    "numpy==2.*",
    "scipy==1.18.*",
    
    # Monitoring
    "prometheus-client==0.19.*",
    "sentry-sdk==1.45.*",
    
    # Utilities
    "python-magic==0.4.*",
    "tqdm==4.66.*",
    "orjson==3.10.*",
    "structlog==24.1.*",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.*",
    "pytest-asyncio==0.23.*",
    "pytest-cov==5.0.*",
    "pytest-mock==3.14.*",
    "ruff==0.5.*",
    "mypy==1.11.*",
    "black==24.4.*",
    "isort==5.13.*",
    "pre-commit==3.7.*",
    "faker==25.3.*",
    "factory-boy==3.3.*",
]
gpu = [
    "torch==2.4.*",
    "torchaudio==2.4.*",
    "torchvision==0.19.*",
]
s3 = [
    "boto3==1.34.*",
    "botocore==1.34.*",
]
gcs = [
    "google-cloud-storage==2.17.*",
]
monitoring = [
    "datadog==0.48.*",
    "newrelic==9.10.*",
]
all = [
    "clipyantra-workers[gpu,s3,gcs,monitoring]",
]

[project.urls]
Homepage = "https://github.com/clipyantra/clipyantra"
Repository = "https://github.com/clipyantra/clipyantra"
Issues = "https://github.com/clipyantra/clipyantra/issues"
Documentation = "https://docs.clipyantra.com"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "gpu: Tests requiring GPU",
]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
select = [
    "A", "B", "C4", "C90", "COM", "CPY", "D", "DTZ", "E", "EM", "ERA", "EXE", "F", "FIX", "FUR", "I", "ICN", "ISC", "LOG", "N", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTC", "PTR", "PTH", "PYI", "Q", "RSE", "RET", "RUF", "SIM", "SLF", "SLOT", "T20", "TCH", "TID", "TRI", "TRY", "UP", "W", "YTT",
]
ignore = []
per-file-ignores = { "tests/*" = ["S101", "D100", "D101", "D102", "D103", "D104", "D105", "D107"] }
exclude = [".git", "__pycache__", ".venv", "build", "dist", "*.egg-info"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true

[tool.pydantic]
# Pydantic v2 config
validate_by_name = true
validate_by_alias = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"